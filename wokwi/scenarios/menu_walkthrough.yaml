# Wokwi automation scenario: walks through the complete 4-button menu of the EleksTube clock
# Screenshots of the displays go to .pio/build_wokwi/screenshots/ (paths are relative to this file).
# Buttons are held 1.5 s: a loop with a redraw of the digits or the menu takes 0.4-1 s in the simulator,
# shorter presses can fall between two button polls (the 4-button menu reacts to the press edge only).
# Kept short on purpose: the Wokwi free plan limits one CLI session to 5 minutes.
#   wokwi-cli --timeout 120000 --scenario wokwi/scenarios/menu_walkthrough.yaml .
name: EleksTube menu walkthrough
version: 1
author: EleksTubeHAX

steps:
  - wait-serial: 'Starting main loop...'
  - delay: 2000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_01_clock.png
  # MODE: open the menu (backlight pattern)
  - set-control:
      part-id: btnMode
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnMode
      name: pressed
      value: 0
  - delay: 1000ms
  # RIGHT: next backlight pattern
  - set-control:
      part-id: btnRight
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnRight
      name: pressed
      value: 0
  - delay: 1000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_02_backlight_pattern.png
  # MODE: pattern color
  - set-control:
      part-id: btnMode
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnMode
      name: pressed
      value: 0
  - delay: 1000ms
  # RIGHT: change color
  - set-control:
      part-id: btnRight
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnRight
      name: pressed
      value: 0
  - delay: 1000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_03_pattern_color.png
  # MODE: backlight intensity
  - set-control:
      part-id: btnMode
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnMode
      name: pressed
      value: 0
  - delay: 1000ms
  # LEFT: darker
  - set-control:
      part-id: btnLeft
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnLeft
      name: pressed
      value: 0
  - delay: 1000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_04_backlight_intensity.png
  # MODE: 12/24 hour
  - set-control:
      part-id: btnMode
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnMode
      name: pressed
      value: 0
  - delay: 1000ms
  # RIGHT: toggle 12 hour mode
  - set-control:
      part-id: btnRight
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnRight
      name: pressed
      value: 0
  - delay: 1000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_05_twelve_hour.png
  # MODE: blank leading hour zero
  - set-control:
      part-id: btnMode
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnMode
      name: pressed
      value: 0
  - delay: 1000ms
  # RIGHT: toggle blanking
  - set-control:
      part-id: btnRight
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnRight
      name: pressed
      value: 0
  - delay: 1000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_06_blank_hours_zero.png
  # MODE: UTC offset hours
  - set-control:
      part-id: btnMode
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnMode
      name: pressed
      value: 0
  - delay: 1000ms
  # RIGHT: +1 hour
  - set-control:
      part-id: btnRight
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnRight
      name: pressed
      value: 0
  - delay: 1000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_07_utc_offset_hour.png
  # MODE: UTC offset 15 minutes
  - set-control:
      part-id: btnMode
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnMode
      name: pressed
      value: 0
  - delay: 1000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_08_utc_offset_15m.png
  # MODE: clock face
  - set-control:
      part-id: btnMode
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnMode
      name: pressed
      value: 0
  - delay: 1000ms
  # RIGHT: next clock face
  - set-control:
      part-id: btnRight
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnRight
      name: pressed
      value: 0
  - delay: 1000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_09_clock_face.png
  # POWER: leave the menu (saves config)
  - set-control:
      part-id: btnPower
      name: pressed
      value: 1
  - delay: 1500ms
  - set-control:
      part-id: btnPower
      name: pressed
      value: 0
  - delay: 1000ms
  - wait-serial: 'Triggered from leaving menu'
  - delay: 2000ms
  - take-screenshot:
      part-id: tubes
      save-to: ../../.pio/build_wokwi/screenshots/menu_10_clock_after_menu.png

; PlatformIO configuration for the Wokwi simulator build.
; Kept out of the main platformio.ini on purpose: CI does not build it and the
; real-hardware environments stay untouched.
;
; Build (from the project root):
;   pio run -c wokwi/platformio_wokwi.ini -e EleksTube_Wokwi
;
; Output used by wokwi.toml:
;   .pio/build_wokwi/EleksTube_Wokwi/wokwi_firmware.elf
;   .pio/build_wokwi/EleksTube_Wokwi/wokwi_flash.bin   (bootloader + partitions + app + LittleFS)

[platformio]
extra_configs = platformio.ini
; Own build folder: PlatformIO wipes the whole build_dir when the project config checksum
; changes, so sharing .pio/build with the normal platformio.ini would delete this build.
build_dir = .pio/build_wokwi

[env:EleksTube_Wokwi]
extends = env:EleksTube
build_flags =
  ${env:EleksTube.build_flags}
  -D WOKWI_SIMULATION ; selects include/_USER_DEFINES_WOKWI.h (template + Wokwi-GUEST WiFi)
  -I include ; TFT_eSPI (lib/) includes GLOBAL_DEFINES.h as User_Setup.h and must find the Wokwi defines
; The web setup portal needs a soft AP, which the simulator does not offer -> classic build
build_unflags =
  -D WEB_SETUP_PORTAL
extra_scripts =
  ${env.extra_scripts}
  pre:wokwi/script_wokwi_progname.py ; fixed file names for wokwi.toml (must run after script_rename_firmware.py)
  post:wokwi/script_wokwi_flash_image.py ; LittleFS + merged flash image for the simulator
